<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geheime Pagina</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        video {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 15px;
            outline: none;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Gefeliciteerd! 🎉</h1>
        <p>Je hebt het juiste woord ingevoerd en de geheime pagina bereikt.</p>

        <!-- Video speler die het videobestand van GitHub laadt -->
        <video controls>
            <source src="video.mp4" type="video/mp4">
            Je browser ondersteunt geen video's.
        </video>
    </div>

</body>
</html>
