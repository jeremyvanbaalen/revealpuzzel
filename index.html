<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toegangscode Vereist</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        input[type="password"], input[type="text"] {
            width: 80%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .error {
            color: red;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Afbeelding -->
        <img src="https://picsum.photos/400/250" alt="Hint of decoratie afbeelding">

        <h2>Voer het geheime woord in</h2>
        <p>Vul het juiste woord in om verder te gaan.</p>

        <!-- Invoerveld en knop -->
        <form id="accessForm" onsubmit="checkWord(event)">
            <input type="password" id="secretInput" placeholder="Typ het woord hier..." required>
            <br>
            <button type="submit">Versturen</button>
        </form>

        <p id="errorMessage" class="error">Onjuist woord! Probeer het opnieuw.</p>
    </div>

    <script>
        function checkWord(event) {
            // Voorkom dat de pagina opnieuw laadt
            event.preventDefault();

            // Stel hier het geheime woord in (in dit voorbeeld: "geheim")
            const correctWord = "geheim"; 

            // Haal de waarde op die de gebruiker heeft ingevuld (omgezet naar kleine letters)
            const userInput = document.getElementById("secretInput").value.trim().toLowerCase();
            const errorMessage = document.getElementById("errorMessage");

            if (userInput === correctWord) {
                // Als het woord goed is, stuur door naar de gewenste pagina
                window.location.href = "geheime-pagina.html"; 
                // Je kunt hier ook een volledige URL van maken, bijv: "https://www.google.com"
            } else {
                // Als het woord fout is, toon de foutmelding
                errorMessage.style.display = "block";
            }
        }
    </script>

</body>
</html>
